<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>滅びの呪文</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden;background:#0d1426;color:#f5ecd7;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}
button,input{font-family:inherit}
button{border:0;cursor:pointer}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:18px}
.scr.on{display:flex}
#title{background:radial-gradient(ellipse at 50% 30%,#2b4a7a 0%,#0d1426 70%)}
h1{font-size:clamp(44px,13vw,92px);letter-spacing:.12em;color:#fff4d6;text-shadow:0 0 18px rgba(255,220,150,.6),0 4px 0 #3a2a10;font-weight:900}
.sub{font-size:15px;color:#c9bfa6;text-align:center;line-height:1.8}
.btn{background:#f5ecd7;color:#1b2a4a;font-weight:900;font-size:18px;padding:13px 26px;border-radius:999px;box-shadow:0 4px 0 #8a7a55}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8a7a55}
.btn.ghost{background:transparent;color:#f5ecd7;border:2px solid #8a7a55;box-shadow:none}
.btn.fire{background:linear-gradient(#ffe7a0,#ffb04a);color:#3a1a00;box-shadow:0 4px 0 #8a4a10,0 0 24px rgba(255,180,80,.55)}
.btn:disabled{opacity:.4}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
/* ステージ */
#stage{padding:0;gap:0;background:#000}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#castBar{position:absolute;left:0;right:0;bottom:0;padding:12px 14px calc(14px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;background:linear-gradient(transparent,rgba(5,8,20,.85) 40%)}
#spell{flex:1;min-width:0;font-size:22px;font-weight:900;padding:12px 14px;border-radius:14px;border:2px solid #8a7a55;background:rgba(10,14,30,.85);color:#fff4d6;text-align:center;letter-spacing:.1em}
#spell::placeholder{color:#7a7058;letter-spacing:0;font-size:16px}
#topBar{position:absolute;left:0;right:0;top:0;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
#topBar button{background:rgba(10,14,30,.7);color:#f5ecd7;border:1.5px solid #8a7a55;border-radius:999px;padding:6px 14px;font-size:14px;font-weight:700}
#modes{position:absolute;left:0;right:0;bottom:80px;display:flex;gap:6px;overflow-x:auto;padding:0 12px;scrollbar-width:none}
#modes::-webkit-scrollbar{display:none}
#modes button{flex:none;background:rgba(10,14,30,.75);color:#e8dcc0;border:1.5px solid #8a7a55;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;font-family:inherit}
#modes button.on{background:#ffcf6a;color:#3a1a00;border-color:#ffcf6a}
#hint{position:absolute;left:0;right:0;bottom:124px;text-align:center;font-size:13px;color:#e8dcc0;text-shadow:0 1px 4px #000;pointer-events:none}
/* 結果 */
#res{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);opacity:0;pointer-events:none;transition:all .35s;width:min(92vw,440px);max-height:92vh;overflow:auto;
     background:rgba(12,16,32,.93);border:2px solid #c9a95a;border-radius:20px;padding:18px 18px 16px;text-align:center;box-shadow:0 0 40px rgba(0,0,0,.6)}
#res.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
#res .sp{font-size:30px;font-weight:900;letter-spacing:.12em;color:#fff4d6}
#res .pct{font-size:64px;font-weight:900;line-height:1;color:#ffcf6a;text-shadow:0 0 16px rgba(255,190,80,.6);margin-top:6px}
#res .pct small{font-size:22px}
#res .rank{font-size:20px;font-weight:900;margin:4px 0 10px}
.bars{display:flex;flex-direction:column;gap:6px;text-align:left;margin:6px 0 10px}
.bar{display:grid;grid-template-columns:4.5em 1fr 2.4em;gap:8px;align-items:center;font-size:14px}
.bar i{display:block;height:10px;border-radius:5px;background:#2a3350;overflow:hidden}
.bar i b{display:block;height:100%;background:linear-gradient(90deg,#ffb04a,#ffe7a0)}
.bar span{text-align:right;font-weight:900}
.why{font-size:13px;line-height:1.7;color:#d9cfb5;text-align:left;background:rgba(255,255,255,.05);border-radius:12px;padding:8px 12px;margin-bottom:12px}
.why div::before{content:"・"}
#big{position:absolute;left:0;right:0;top:38%;text-align:center;font-size:clamp(40px,14vw,110px);font-weight:900;letter-spacing:.15em;color:#fff;pointer-events:none;opacity:0;
     text-shadow:0 0 20px #fff6c0,0 0 50px #ffcf6a}
</style>
</head>
<body>

<section class="scr on" id="title">
  <h1>滅びの呪文</h1>
  <p class="sub">写真を撮って、呪文をひとつ。<br>強い呪文ほど、跡形もなく崩れる。</p>
  <div class="row"><button class="btn" id="bShot">📷 写真を撮る</button><button class="btn" id="bPick">🖼 写真をえらぶ</button></div>
  <button class="btn ghost" id="bSample">お手本の城で試す</button>
  <p class="sub" style="font-size:12px;opacity:.7">写真はこの画面の中だけで使い、保存しません</p>
  <input type="file" id="file" accept="image/*" hidden>
</section>

<section class="scr" id="stage">
  <canvas id="cv"></canvas>
  <div id="topBar"><button id="bBack">← 写真を変える</button><button id="bOrig">加工前</button></div>
  <div id="big"></div>
  <div id="hint">呪文をとなえて、この景色を崩せ</div>
  <div id="modes"></div>
  <div id="castBar"><input id="spell" maxlength="16" placeholder="呪文を入力（16文字まで）" autocomplete="off"><button class="btn fire" id="bCast">となえる</button></div>
  <div id="res">
    <div class="sp" id="rSpell"></div>
    <div class="pct"><span id="rPct">0</span><small>% 崩壊</small></div>
    <div class="rank" id="rRank"></div>
    <div class="bars" id="rBars"></div>
    <div class="why" id="rWhy"></div>
    <div class="row"><button class="btn fire" id="bAgain">別の呪文で</button><button class="btn ghost" id="bNew">写真を変える</button></div>
  </div>
</section>

<script>
const $ = id => document.getElementById(id);
const R = Math.random, clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function show(id){ document.querySelectorAll('.scr').forEach(s => s.classList.toggle('on', s.id === id)); }

// ================= 音 =================
let AC = null;
function ac(){ return AC = AC || new (window.AudioContext || window.webkitAudioContext)(); }
function tone(f, d, type='sine', v=.1, slide=0, t0=0){
  try { const a = ac(), o = a.createOscillator(), g = a.createGain(), t = a.currentTime + t0;
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f * slide), t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0005, t + d); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .05); } catch(e){}
}
function rumble(d, v){
  try { const a = ac(), n = a.sampleRate * d, b = a.createBuffer(1, n, a.sampleRate), c = b.getChannelData(0);
    let last = 0; for (let i = 0; i < n; i++){ last = last * .97 + (R() * 2 - 1) * .03; c[i] = last * 6 * Math.min(1, (n - i) / (n * .5)); }
    const s = a.createBufferSource(), g = a.createGain(), f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 220;
    s.buffer = b; g.gain.value = v; s.connect(f); f.connect(g); g.connect(a.destination); s.start(); } catch(e){}
}
function crack(){ try { const a = ac(), n = a.sampleRate * .12, b = a.createBuffer(1, n, a.sampleRate), c = b.getChannelData(0);
  for (let i = 0; i < n; i++) c[i] = (R() * 2 - 1) * Math.pow(1 - i / n, 3); const s = a.createBufferSource(), g = a.createGain(); s.buffer = b; g.gain.value = .25; s.connect(g); g.connect(a.destination); s.start(); } catch(e){} }

// ================= 写真を読む =================
let src = null;      // 元の写真（縮小済み）
let lastSky = null, sampleMask = null;  // 空だと判定したところ（背景あつかい）
let fgCv = null, bgCv = null, maskCv = null;   // 物体・背景（穴埋め済み）・物体の形
let art = null;      // アニメ風に加工したもの
function loadUrl(u){ return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = u; }); }
function fit(img, max){
  const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height, k = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); return c;
}
$('bShot').onclick = () => { if (window.Android && Android.takePhoto) Android.takePhoto(); else $('file').click(); };
$('bPick').onclick = () => $('file').click();
$('file').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const u = URL.createObjectURL(f); try { start(fit(await loadUrl(u), 900)); } catch(err){ alert('写真を読みこめませんでした'); } URL.revokeObjectURL(u);
};
window.onNativePhoto = async u => { if (!u) return; try { start(fit(await loadUrl(u), 900)); } catch(e){} };
$('bSample').onclick = () => start(sampleCastle(), true);
$('bBack').onclick = $('bNew').onclick = () => { reset(); show('title'); };

// お手本の城（自前で描く）
function sampleCastle(){
  const W = 900, H = 640, c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
  const sky = x.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, '#7fb6e8'); sky.addColorStop(1, '#dcefff'); x.fillStyle = sky; x.fillRect(0, 0, W, H);
  x.fillStyle = '#6aa557'; x.beginPath(); x.moveTo(0, 470); x.quadraticCurveTo(300, 380, 520, 430); x.quadraticCurveTo(720, 470, 900, 420); x.lineTo(900, 640); x.lineTo(0, 640); x.fill();
  x.fillStyle = '#4f8a45'; x.beginPath(); x.moveTo(0, 560); x.quadraticCurveTo(400, 500, 900, 560); x.lineTo(900, 640); x.lineTo(0, 640); x.fill();
  const before = x.getImageData(0, 0, W, H).data;
  const stone = (px, py, w, h, col) => { x.fillStyle = col; x.fillRect(px, py, w, h); x.strokeStyle = 'rgba(0,0,0,.18)'; x.lineWidth = 1;
    for (let yy = py + 14; yy < py + h; yy += 14){ x.beginPath(); x.moveTo(px, yy); x.lineTo(px + w, yy); x.stroke(); } };
  stone(300, 250, 300, 190, '#cbbf9f'); stone(250, 180, 80, 260, '#bfb393'); stone(570, 180, 80, 260, '#bfb393'); stone(410, 120, 80, 140, '#d6cba9');
  const roof = (px, py, w, h, col) => { x.fillStyle = col; x.beginPath(); x.moveTo(px - 8, py); x.lineTo(px + w / 2, py - h); x.lineTo(px + w + 8, py); x.fill(); };
  roof(250, 180, 80, 90, '#3f6fb0'); roof(570, 180, 80, 90, '#3f6fb0'); roof(410, 120, 80, 110, '#2f5a99');
  x.fillStyle = '#5a3a1e'; x.beginPath(); x.moveTo(420, 440); x.lineTo(420, 380); x.quadraticCurveTo(450, 350, 480, 380); x.lineTo(480, 440); x.fill();
  x.fillStyle = '#2b2b3a'; for (const [wx, wy] of [[275, 230], [595, 230], [435, 170], [340, 300], [540, 300], [275, 320], [595, 320]]) x.fillRect(wx, wy, 26, 36);
  for (let i = 300; i < 600; i += 30) x.fillStyle = '#cbbf9f', x.fillRect(i, 236, 18, 16);
  x.fillStyle = '#d33'; x.beginPath(); x.moveTo(450, 10); x.lineTo(450, 50); x.lineTo(480, 30); x.fill(); x.strokeStyle = '#333'; x.beginPath(); x.moveTo(450, 10); x.lineTo(450, 60); x.stroke();
  // 城の形（描く前と変わったところ）をそのまま物体の形にする
  const after = x.getImageData(0, 0, W, H).data; sampleMask = new Uint8Array(W * H);
  for (let i = 0; i < W * H; i++) sampleMask[i] = Math.abs(after[i*4] - before[i*4]) + Math.abs(after[i*4+1] - before[i*4+1]) + Math.abs(after[i*4+2] - before[i*4+2]) > 12 ? 1 : 0;
  return c;
}

// ================= 手描きアニメ風の加工 =================
function animeize(c0, sample){
  const W = c0.width, H = c0.height;
  const g0 = c0.getContext('2d', {willReadFrequently:true}), d0 = g0.getImageData(0, 0, W, H).data;
  // 1) なめらかにする（ぼかしをかけて、色を少なめに）
  const sm = document.createElement('canvas'); sm.width = W; sm.height = H; const gs = sm.getContext('2d', {willReadFrequently:true});
  gs.filter = 'blur(1.6px)'; gs.drawImage(c0, 0, 0); gs.filter = 'none';
  const img = gs.getImageData(0, 0, W, H), d = img.data;
  // 2) 空を探す：上のふちからつながっている、明るい青や白っぽいところ
  const sky = new Uint8Array(W * H);
  // なめらかさ：ぼかした明るさの変化が小さいところだけ空とみなす
  const sd0 = gs.getImageData(0, 0, W, H).data, LL = new Float32Array(W * H);
  for (let i = 0; i < W * H; i++) LL[i] = sd0[i*4] * .3 + sd0[i*4+1] * .59 + sd0[i*4+2] * .11;
  const smooth = i => { const x = i % W, y = (i / W) | 0; if (x < 2 || y < 2 || x >= W - 2 || y >= H - 2) return true;
    return Math.abs(LL[i-2] - LL[i+2]) + Math.abs(LL[i-2*W] - LL[i+2*W]) < 22; };
  const isSkyCol = i => { const r = d0[i*4], g = d0[i*4+1], b = d0[i*4+2], mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (r + g + b) / 3;
    return ((b - r > 25 && b >= g - 12 && l > 155) || (l > 205 && mx - mn < 32)) && smooth(i); };
  const st = []; for (let x = 0; x < W; x++){ const i = x; if (isSkyCol(i)){ sky[i] = 1; st.push(i); } }
  while (st.length){ const i = st.pop(), x = i % W, y = (i / W) | 0;
    for (const [u, v] of [[1,0],[-1,0],[0,1],[0,-1]]){ const xx = x + u, yy = y + v; if (xx < 0 || yy < 0 || xx >= W || yy >= H) continue; const j = yy * W + xx;
      if (!sky[j] && yy < H * .75 && isSkyCol(j)){ const dr = Math.abs(d0[i*4] - d0[j*4]) + Math.abs(d0[i*4+1] - d0[j*4+1]) + Math.abs(d0[i*4+2] - d0[j*4+2]); if (dr < 40){ sky[j] = 1; st.push(j); } } } }
  let skyN = 0, skyY = 0, topN = 0; for (let i = 0; i < W * H; i++) if (sky[i]){ skyN++; skyY += (i / W) | 0; }
  for (let x = 0; x < W; x++) topN += sky[x];
  // 空らしい：ある程度の広さがあり、上のほうにかたまっていて、上のふちの多くが空
  const hasSky = skyN > W * H * .05 && skyY / skyN < H * .35 && topN > W * .4;
  lastSky = (hasSky || sample) ? sky : null;
  // 3) 色をアニメ風に：彩度を上げ、明るさを段に分け、影を青緑に、光を暖色に
  for (let i = 0; i < W * H; i++){
    const k = i * 4; let r = d[k], g = d[k+1], b = d[k+2];
    const l = (r * .3 + g * .59 + b * .11);
    // 彩度アップ
    r = l + (r - l) * 1.35; g = l + (g - l) * 1.35; b = l + (b - l) * 1.35;
    // 明るさを段にする（なめらかに）
    const lv = Math.round(l / 42) * 42, kk = (lv + 10) / (l + 10); const m = .55;
    r = r * (1 - m) + r * kk * m; g = g * (1 - m) + g * kk * m; b = b * (1 - m) + b * kk * m;
    // 色調：暗いところは青緑寄り、明るいところは暖色寄り
    const t = l / 255;
    r += (t - .5) * 22; g += (t - .5) * 8 + 4; b += (.5 - t) * 20;
    d[k] = clamp(r, 0, 255); d[k+1] = clamp(g, 0, 255); d[k+2] = clamp(b, 0, 255);
  }
  gs.putImageData(img, 0, 0);
  const out = document.createElement('canvas'); out.width = W; out.height = H; const o = out.getContext('2d');
  // 4) 空を、塗った空と入道雲に差しかえる
  if (hasSky && !sample){
    const sk = document.createElement('canvas'); sk.width = W; sk.height = H; paintSky(sk.getContext('2d'), W, H);
    const sd = sk.getContext('2d').getImageData(0, 0, W, H).data, md = gs.getImageData(0, 0, W, H);
    // 空のふちをなじませる
    const soft = new Float32Array(W * H); for (let i = 0; i < W * H; i++) soft[i] = sky[i];
    for (let pass = 0; pass < 2; pass++) for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++){ const i = y * W + x; soft[i] = (soft[i] * 4 + soft[i-1] + soft[i+1] + soft[i-W] + soft[i+W]) / 8; }
    for (let i = 0; i < W * H; i++){ const a = soft[i]; if (a <= 0) continue; for (let c = 0; c < 3; c++) md.data[i*4+c] = md.data[i*4+c] * (1 - a) + sd[i*4+c] * a; }
    gs.putImageData(md, 0, 0);
  } else if (sample){
    const sk = document.createElement('canvas'); sk.width = W; sk.height = H; paintSky(sk.getContext('2d'), W, H);
    const sd = sk.getContext('2d').getImageData(0, 0, W, H).data, md = gs.getImageData(0, 0, W, H);
    for (let i = 0; i < W * H; i++) if (sky[i]) for (let c = 0; c < 3; c++) md.data[i*4+c] = sd[i*4+c];
    gs.putImageData(md, 0, 0);
  }
  o.drawImage(sm, 0, 0);
  // 5) 線画：明るさの差が大きいところに、こげ茶の細い線
  const L = new Float32Array(W * H); const dd = gs.getImageData(0, 0, W, H).data;
  for (let i = 0; i < W * H; i++) L[i] = dd[i*4] * .3 + dd[i*4+1] * .59 + dd[i*4+2] * .11;
  const lines = o.getImageData(0, 0, W, H);
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++){
    const i = y * W + x;
    const gx = -L[i-W-1] - 2*L[i-1] - L[i+W-1] + L[i-W+1] + 2*L[i+1] + L[i+W+1];
    const gy = -L[i-W-1] - 2*L[i-W] - L[i-W+1] + L[i+W-1] + 2*L[i+W] + L[i+W+1];
    const mg = Math.hypot(gx, gy);
    if (mg > 70 && !(sky[i] && !sample)){ const a = Math.min(.75, (mg - 70) / 160); const k = i * 4;
      lines.data[k] = lines.data[k] * (1 - a) + 50 * a; lines.data[k+1] = lines.data[k+1] * (1 - a) + 34 * a; lines.data[k+2] = lines.data[k+2] * (1 - a) + 30 * a; }
  }
  o.putImageData(lines, 0, 0);
  // 6) 光と影：ふんわり光らせて、四隅を少し暗く
  o.globalCompositeOperation = 'soft-light'; o.globalAlpha = .35; o.filter = 'blur(6px)'; o.drawImage(out, 0, 0); o.filter = 'none'; o.globalAlpha = 1;
  o.globalCompositeOperation = 'source-over';
  const vg = o.createRadialGradient(W/2, H/2, Math.min(W, H) * .35, W/2, H/2, Math.hypot(W, H) * .6);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(10,20,40,.35)'); o.fillStyle = vg; o.fillRect(0, 0, W, H);
  return out;
}
function paintSky(x, W, H){
  const g = x.createLinearGradient(0, 0, 0, H * .8); g.addColorStop(0, '#2f6fc4'); g.addColorStop(.55, '#6fb1ea'); g.addColorStop(1, '#cfe9fb');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  // 入道雲
  const cloud = (cx, cy, s) => {
    for (let i = 0; i < 14; i++){
      const a = R() * Math.PI, rr = s * (.35 + R() * .45), px = cx + Math.cos(a) * s * (.4 + R() * .8) * (R() < .5 ? -1 : 1), py = cy - Math.sin(a) * s * .5;
      const gg = x.createRadialGradient(px - rr * .3, py - rr * .4, rr * .1, px, py, rr);
      gg.addColorStop(0, '#ffffff'); gg.addColorStop(.7, '#f1f4fb'); gg.addColorStop(1, 'rgba(200,214,236,.0)');
      x.fillStyle = gg; x.beginPath(); x.arc(px, py, rr, 0, Math.PI * 2); x.fill();
    }
    x.fillStyle = 'rgba(170,190,220,.35)'; x.beginPath(); x.ellipse(cx, cy + s * .15, s * 1.2, s * .18, 0, 0, Math.PI * 2); x.fill();
  };
  cloud(W * (.2 + R() * .15), H * .32, W * .16); cloud(W * (.7 + R() * .15), H * .22, W * .2); cloud(W * .5, H * .5, W * .09);
}

// ================= 呪文の強さ =================

// ================= 消え方 =================

// 物体を小さなマスに分けて、消えるマスと順番を決める

// ================= となえる =================

const pick = a => a[Math.floor(R() * a.length)];

// ================= 描く =================

      else { if (!c.ash){ c.ash = true; c.vx = (R() - .5) * 25; c.vy = 10 + R() * 30; }
        c.vy += 60 * dt; c.px += c.vx * dt; c.py += c.vy * dt; const al = 1 - (a - 1.1) / 1.6; if (al <= 0 || c.py > Hd){ c.dead = true; continue; }
        ctx.globalAlpha = al; ctx.fillStyle = '#8f8a84'; ctx.fillRect(c.px, c.py, c.sz * .7, c.sz * .7); ctx.globalAlpha = 1; }
    } else if (mode === 'melt'){
      c.vy = Math.min(160, (20 + a * 60) * c.k); 
      if (c.py < c.stop){ c.py = Math.min(c.stop, c.py + c.vy * dt); c.h = c.sz * (1 + Math.min(3, a * 1.5 * c.k)); }
      else { c.h = Math.max(c.sz * .4, (c.h || c.sz) - dt * 8); c.px += (c.x - (bh ? bh.x : c.x)) * .15 * dt; c.w = (c.w || c.sz) + dt * 4; }
      const al = a > 4 ? 1 - (a - 4) / 2.5 : 1; if (al <= 0){ c.dead = true; continue; }
      const dk = Math.min(.45, a * .12);
      ctx.globalAlpha = al; ctx.fillStyle = `rgb(${c.r * (1 - dk)|0},${c.g * (1 - dk)|0},${c.b * (1 - dk)|0})`;
      ctx.fillRect(c.px, c.py - (c.h - c.sz), c.w || c.sz, c.h); ctx.globalAlpha = 1;
    }
  }
  // 炎
  for (const f of flames){ f.t += dt; f.x += f.vx * dt; f.y += f.vy * dt; }
  flames = flames.filter(f => f.t < f.life);
  ctx.globalCompositeOperation = 'lighter';
  for (const f of flames){ const k = f.t / f.life; ctx.fillStyle = `rgba(255,${(200 - k * 150)|0},${(60 - k * 50)|0},${(1 - k) * .8})`; ctx.beginPath(); ctx.arc(f.x, f.y, f.s * (1 - k * .5), 0, Math.PI * 2); ctx.fill(); }
  ctx.globalCompositeOperation = 'source-over';
}
</script>
